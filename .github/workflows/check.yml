name: Check project

on: [push, pull_request]

permissions:
  contents: read

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Test shared rules
        run: python -m unittest discover -s tests -v
      - name: Validate clean notebook sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat

          for path in Path('notebooks').glob('*.ipynb'):
              notebook = nbformat.read(path, as_version=4)
              nbformat.validate(notebook)
              for cell in notebook.cells:
                  if cell.cell_type == 'code':
                      assert cell.execution_count is None and not cell.outputs, path
          PY
      - name: Run notebooks in order
        run: python run_notebooks.py
      - name: Check notebook sources stay clean
        run: git diff --exit-code -- notebooks/
